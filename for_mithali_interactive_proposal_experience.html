  <style>
    :root {
      --neon-pink: #ff2a85;
      --neon-rose: #ff5ca3;
      --soft-pink: #ffd6e8;
      --deep-black: #040307;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--deep-black);
      color: #1f1624;
      min-height: 100dvh;
    }

    .font-serif-elegant { font-family: 'Playfair Display', serif; }
    .font-script { font-family: 'Great Vibes', cursive; }

    /* =====================================================================
       GLOBAL CANVAS, LETTERBOX BARS & INTRO CINEMATIC ANIMATIONS
       ===================================================================== */
    #bg-particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .letterbox-bar {
      position: fixed;
      left: 0;
      width: 100%;
      height: 9vh;
      background: #000000;
      z-index: 60;
      pointer-events: none;
      transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .letterbox-top { top: 0; }
    .letterbox-bottom { bottom: 0; }
    .letterbox-hidden-top { transform: translateY(-105%); }
    .letterbox-hidden-bottom { transform: translateY(105%); }

    #intro-stage {
      background-color: var(--deep-black);
      transition: background-color 0.55s ease;
    }

    .intro-radial-glow {
      background: radial-gradient(circle at center, rgba(255, 42, 133, 0.34) 0%, rgba(168, 85, 247, 0.12) 38%, rgba(4, 3, 7, 0) 70%);
      opacity: 0;
      animation: introGlowIn 2.2s ease forwards;
    }
    @keyframes introGlowIn {
      0% { opacity: 0; transform: scale(0.75); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    .neon-text-path {
      fill: rgba(255, 42, 133, 0);
      stroke: #ff2a85;
      stroke-width: 2.2;
      stroke-dasharray: 620;
      stroke-dashoffset: 620;
      filter: drop-shadow(0 0 12px rgba(255, 42, 133, 0.9)) drop-shadow(0 0 28px rgba(255, 42, 133, 0.65));
      animation:
        drawNeonName 2.4s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards,
        fillNeonName 0.75s ease 2.85s forwards;
    }
    @keyframes drawNeonName {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fillNeonName {
      0% { fill: rgba(255, 42, 133, 0); }
      100% {
        fill: #ff2a85;
        filter: drop-shadow(0 0 22px rgba(255, 42, 133, 1)) drop-shadow(0 0 46px rgba(255, 92, 163, 0.9));
      }
    }

    .shockwave-ring {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 9999px;
      border: 4px solid #ff2a85;
      box-shadow: 0 0 30px #ff2a85;
      animation: shockwaveExpand 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes shockwaveExpand {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(22); opacity: 0; }
    }

    .burst-flash {
      background: radial-gradient(circle, #ffffff 0%, #ffd6e8 45%, #ff2a85 100%);
      animation: burstExpand 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes burstExpand {
      0% { transform: scale(0.2); opacity: 0.95; }
      100% { transform: scale(24); opacity: 1; }
    }

    .heart-line-path {
      fill: rgba(255, 42, 133, 0);
      stroke: #ff2a85;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      filter: drop-shadow(0 8px 20px rgba(255, 42, 133, 0.45));
      animation: drawHeartLine 1.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes drawHeartLine {
      0% { stroke-dashoffset: 520; fill: rgba(255, 42, 133, 0); }
      80% { stroke-dashoffset: 0; fill: rgba(255, 42, 133, 0.14); }
      100% { stroke-dashoffset: 0; fill: rgba(255, 42, 133, 0.22); }
    }

    .heart-zoom-transition {
      animation: heartZoomIn 0.95s cubic-bezier(0.7, 0, 0.3, 1) forwards;
    }
    @keyframes heartZoomIn {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(24); opacity: 0; }
    }

    /* =====================================================================
       THEMES & DYNAMIC BACKGROUNDS (MULTI-COLOR PER SCENE)
       ===================================================================== */
    .theme-peach {
      background: radial-gradient(circle at 20% 20%, #fffaf5 0%, #ffe8d6 48%, #ffd1dc 100%);
      color: #2b1822;
      transition: background 1.1s ease, color 0.8s ease;
    }

    .theme-blue {
      background: radial-gradient(circle at 80% 15%, #f0f9ff 0%, #dbeafe 48%, #bfdbfe 100%);
      color: #0f172a;
      transition: background 1.1s ease, color 0.8s ease;
    }

    .theme-royal {
      background: linear-gradient(180deg, #f5f3ff 0%, #ede9fe 50%, #ddd6fe 100%);
      color: #1e1b4b;
      transition: background 1.1s ease, color 0.8s ease;
    }

    .theme-green {
      background: radial-gradient(circle at 50% 15%, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
      color: #064e3b;
      transition: background 1.1s ease, color 0.8s ease;
    }

    .theme-lavender {
      background: radial-gradient(circle at 20% 80%, #faf5ff 0%, #e0f2fe 50%, #f3e8ff 100%);
      color: #1e1b4b;
      transition: background 1.1s ease, color 0.8s ease;
    }

    .theme-dark-aurora {
      background: linear-gradient(-45deg, #040308, #081c2e, #24062b, #05221c, #310620);
      background-size: 400% 400%;
      animation: auroraFlow 10s ease infinite;
      color: #ffffff;
    }

    @keyframes auroraFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* =====================================================================
       3D CHESSBOARD STAGE & SPOTLIGHT BEAMS (ROYAL INDIGO & GOLD)
       ===================================================================== */
    .chess-stage {
      perspective: 550px;
      overflow: hidden;
    }

    .chess-grid-3d {
      width: 240%;
      height: 300px;
      margin-left: -70%;
      transform: rotateX(64deg) translateY(25px);
      background-image:
        linear-gradient(45deg, rgba(99, 102, 241, 0.25) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(99, 102, 241, 0.25) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(245, 158, 11, 0.22) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(245, 158, 11, 0.22) 75%);
      background-size: 64px 64px;
      background-position: 0 0, 0 32px, 32px -32px, -32px 0px;
      animation: chessMove 5s linear infinite;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.95) 20%, rgba(0,0,0,0));
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.95) 20%, rgba(0,0,0,0));
    }

    @keyframes chessMove {
      0% { background-position: 0 0, 0 32px, 32px -32px, -32px 0px; }
      100% { background-position: 0 64px, 0 96px, 32px 32px, -32px 64px; }
    }

    .chess-piece-left { animation: pieceApproachLeft 2.2s ease-in-out infinite alternate; }
    .chess-piece-right { animation: pieceApproachRight 2.2s ease-in-out infinite alternate; }

    @keyframes pieceApproachLeft {
      0% { transform: translateX(-22px) rotate(-6deg); }
      100% { transform: translateX(10px) translateY(-8px) rotate(4deg); }
    }
    @keyframes pieceApproachRight {
      0% { transform: translateX(22px) rotate(6deg); }
      100% { transform: translateX(-10px) translateY(-8px) rotate(-4deg); }
    }

    /* =====================================================================
       CINEMATIC SCROLL-REVEAL EFFECTS
       ===================================================================== */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(55px) scale(0.94);
      filter: blur(6px);
      transition:
        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scroll-reveal.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .scroll-cue {
      animation: scrollCueBounce 1.8s ease-in-out infinite;
    }
    @keyframes scrollCueBounce {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(8px); opacity: 1; }
    }

    /* =====================================================================
       GLASSMORPHISM, 3D POLAROID & NEON BUTTONS
       ===================================================================== */
    .glass-light {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 22px 48px -14px rgba(15, 23, 42, 0.14);
    }

    .glass-dark {
      background: rgba(12, 8, 20, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 42, 133, 0.4);
      box-shadow: 0 24px 60px -12px rgba(255, 42, 133, 0.38);
    }

    .neon-btn-primary {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ff1e7a 0%, #ff5ca3 100%);
      box-shadow: 0 10px 28px -4px rgba(255, 42, 133, 0.55);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }
    .neon-btn-primary::after {
      content: "";
      position: absolute;
      top: 0; left: -120%;
      width: 80%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      transform: skewX(-22deg);
      animation: btnShine 3.2s infinite;
    }
    @keyframes btnShine {
      0%, 70% { left: -120%; }
      100% { left: 160%; }
    }
    .neon-btn-primary:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 16px 36px -2px rgba(255, 42, 133, 0.8);
    }
    .neon-btn-primary:active { transform: scale(0.96); }

    .wingman-float { animation: gentleFloat 3s ease-in-out infinite; }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .cinematic-enter {
      animation: cinematicEnter 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cinematicEnter {
      0% { opacity: 0; transform: translateY(28px) scale(0.96); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .polaroid-3d {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
      transform-style: preserve-3d;
    }
    .polaroid-3d:hover {
      transform: perspective(700px) rotateY(-6deg) rotateX(4deg) scale(1.04);
      box-shadow: 0 28px 50px -12px rgba(59, 130, 246, 0.35);
    }

    #toast-box { transition: opacity 0.3s ease, transform 0.3s ease; }
  </style>
</head>
<body class="selection:bg-pink-500 selection:text-white">

  <!-- Cinematic Movie Letterbox Bars -->
  <div id="bar-top" class="letterbox-bar letterbox-top"></div>
  <div id="bar-bottom" class="letterbox-bar letterbox-bottom"></div>

  <!-- GLOBAL INTERACTIVE PARTICLE / HEART MORPH / FIREWORKS CANVAS -->
  <canvas id="bg-particle-canvas"></canvas>

  <!-- Subtle Sound Toggle -->
  <button id="sound-toggle" onclick="toggleSound()" aria-label="Toggle Sound"
    class="fixed top-4 right-4 z-50 hidden items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold bg-white/85 text-pink-600 border border-pink-200 shadow-md backdrop-blur-md hover:scale-105 transition cursor-pointer">

  <!-- Custom Toast Notification (No alert!) -->

    Notification
  </div>

  <!-- =========================================================================
       SCENE 0: CINEMATIC BLACK -> NEON MITALI -> SHOCKWAVE BURST -> HEART ZOOM

  <section id="intro-stage" class="fixed inset-0 z-50 flex flex-col items-center justify-center overflow-hidden">
    <div id="intro-glow" class="intro-radial-glow absolute inset-0 pointer-events-none"></div>

    <!-- Step 1: Neon Stroke "MITALI" -->
    <div id="neon-name-wrapper" class="relative z-10 w-full max-w-xl px-6 flex flex-col items-center">
      <p id="intro-subtitle" class="text-[11px] sm:text-xs uppercase tracking-[0.4em] text-pink-400/90 mb-3 opacity-0 transition-opacity duration-700">
        A Cinematic Story For
      </p>
      <svg viewBox="0 0 560 135" class="w-full h-auto overflow-visible">
        <text x="50%" y="95" text-anchor="middle"
          class="neon-text-path font-serif-elegant font-bold tracking-[0.15em]"
          style="font-size: 78px;">
          MITALI
        </text>
      </svg>
    </div>

    <!-- Step 2: Shockwave + Pink-to-White Burst -->
    <div id="shockwave-el" class="hidden shockwave-ring z-20 pointer-events-none"></div>
    <div id="burst-circle" class="hidden absolute w-44 h-44 rounded-full z-20 pointer-events-none"></div>

    <!-- Step 3: Line-drawn Heart that Zooms In -->
    <div id="heart-reveal-wrapper" class="hidden relative z-30 flex items-center justify-center">
      <svg id="intro-heart-svg" viewBox="0 0 200 180" class="w-40 h-40 sm:w-48 sm:h-48 overflow-visible">
        <path class="heart-line-path"
          d="M100 158 C100 158 24 108 24 58 C24 32 45 16 68 16 C83 16 94 25 100 36 C106 25 117 16 132 16 C155 16 176 32 176 58 C176 108 100 158 100 158 Z" />
      </svg>
    </div>
  </section>

  <!-- =========================================================================
       MAIN STAGE (SCENES 1 TO 7 + CINEMATIC SCROLL CHAPTER)
       ========================================================================= -->
  <main id="main-stage" class="theme-peach min-h-[100dvh] w-full flex flex-col items-center justify-center px-4 py-8 sm:px-6 relative overflow-x-hidden opacity-0 transition-opacity duration-700">

    <!-- 3D Chessboard Background Layer (Scene 3) -->
    <div id="chess-bg-layer" class="hidden fixed inset-0 pointer-events-none z-0 flex flex-col justify-end">
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(99,102,241,0.22),transparent_60%)]"></div>
      <div class="chess-stage w-full">
        <div class="chess-grid-3d"></div>
      </div>
    </div>

    <!-- Top Progress Pill -->
    <div id="progress-bar-wrap" class="fixed top-4 left-1/2 -translate-x-1/2 w-44 sm:w-64 z-40 transition-opacity duration-500">
      <div class="h-1.5 w-full bg-black/10 rounded-full overflow-hidden backdrop-blur-sm">
        <div id="progress-fill" class="h-full bg-gradient-to-r from-amber-400 via-sky-500 via-emerald-400 to-pink-500 rounded-full transition-all duration-700" style="width: 10%;"></div>
      </div>
    </div>

    <!-- Dynamic Story Container -->
    <div id="story-container" class="w-full max-w-xl z-20 flex flex-col items-center relative">
      <!-- Scenes injected dynamically -->
    </div>

  </main>

  <script>
    /* =========================================================================
       CONFIGURATION & ASSETS
       Put Ansh's 2 photos in the same folder as this HTML file:
       - image_1ea2ac.png (Blue kurta photo)
       - image_1ea303.png (White t-shirt side profile photo)
       ========================================================================= */
    const CONFIG = {
      girlName: "Mitali",
      boyName: "Ansh",
      photo1: "ansh_kurta.png",
      photo2: "ansh_lakers.jpg",
      city: "Bangalore 📍",
      height: "6'1 ft",
      grade: "9th Grade",
      sports: "Basketball 🏀 & Cricket (Medium Pacer) 🏏⚡",
      hobby: "Part-time Editor 🎬✂️",
      whatsappNumber: "" // Optional: e.g. "919876543210"
    };

    const FALLBACK_PHOTO_1 = "ansh_kurta.png";
    const FALLBACK_PHOTO_2 = "ansh_lakers.jpg";

    /* =========================================================================
       WARM CINEMATIC AUDIO ENGINE (Tone.js)
       Silky sine-kalimba + dreamy pad + lowpass filter + reverb (Zero harshness!)
       ========================================================================= */
    let soundEnabled = true;
    let kalimbaSynth = null;
    let padSynth = null;
    let audioReady = false;

    function initAudio() {
      try {
        if (!audioReady && typeof Tone !== "undefined") {
          const limiter = new Tone.Limiter(-6).toDestination();

          const reverb = new Tone.Freeverb({
            roomSize: 0.72,
            dampening: 2000,
            wet: 0.36
          }).connect(limiter);

          const warmFilter = new Tone.Filter({
            frequency: 1500,
            type: "lowpass",
            rolloff: -24
          }).connect(reverb);

          kalimbaSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.018, decay: 0.32, sustain: 0.04, release: 1.3 }
          }).connect(warmFilter);
          kalimbaSynth.volume.value = -14;

          padSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.35, decay: 0.6, sustain: 0.4, release: 2.6 }
          }).connect(warmFilter);
          padSynth.volume.value = -19;

          audioReady = true;
        }
        if (typeof Tone !== "undefined" && Tone.context.state !== "running") {
          Tone.start();
        }
      } catch (e) {}
    }

    function playChime(type = "click") {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!kalimbaSynth || !padSynth) return;
        const now = Tone.now();

        if (type === "click") {
          kalimbaSynth.triggerAttackRelease("G4", "16n", now, 0.35);
        } else if (type === "cute") {
          kalimbaSynth.triggerAttackRelease("E4", "8n", now, 0.45);
          kalimbaSynth.triggerAttackRelease("B4", "4n", now + 0.09, 0.5);
        } else if (type === "magic") {
          const notes = ["C4", "E4", "G4", "B4", "D5"];
          notes.forEach((n, idx) => {
            kalimbaSynth.triggerAttackRelease(n, "4n", now + idx * 0.085, 0.42);
          });
        } else if (type === "dramatic") {
          padSynth.triggerAttackRelease(["F3", "C4", "E4", "A4"], "2n", now, 0.55);
          kalimbaSynth.triggerAttackRelease("C5", "2n", now + 0.18, 0.35);
        } else if (type === "celebrate") {
          padSynth.triggerAttackRelease(["C3", "G3", "B3", "E4"], "1n", now, 0.55);
          const arp = ["C4", "E4", "G4", "B4", "D5", "E5"];
          arp.forEach((n, idx) => {
            kalimbaSynth.triggerAttackRelease(n, "2n", now + idx * 0.11, 0.45);
          });
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-icon").textContent = soundEnabled ? "🔊" : "🔇";
      document.getElementById("sound-label").textContent = soundEnabled ? "SFX On" : "Muted";
      if (soundEnabled) playChime("click");
    }

    function showToast(msg) {
      const toast = document.getElementById("toast-box");
      toast.textContent = msg;
      toast.classList.remove("opacity-0", "translate-y-4");
      toast.classList.add("opacity-100", "translate-y-0");
      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-4");
        toast.classList.remove("opacity-100", "translate-y-0");
      }, 2800);
    }

    /* =========================================================================
       MASTER MULTI-COLOR PARTICLE ENGINE
       Modes: 'intro', 'gold', 'blue', 'royal', 'green', 'lavender',
              'heartMorph', 'aurora', 'fireworks'
       ========================================================================= */
    const bgCanvas = document.getElementById("bg-particle-canvas");
    const bgCtx = bgCanvas.getContext("2d");
    let particleMode = "intro";
    let ambientParticles = [];
    let heartMorphParticles = [];
    let fireworkRockets = [];
    let fireworkSparks = [];
    let pointerSparks = [];
    let mousePos = { x: -999, y: -999 };
    let heartBeatPhase = 0;

    function resizeBgCanvas() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      if (particleMode === "heartMorph") buildHeartMorphTargets();
    }
    window.addEventListener("resize", resizeBgCanvas);
    resizeBgCanvas();

    function spawnPointerSpark(x, y) {
      mousePos.x = x;
      mousePos.y = y;
      const modePalette = {
        gold: ["#f59e0b", "#fb7185", "#fcd34d"],
        blue: ["#38bdf8", "#3b82f6", "#818cf8"],
        royal: ["#8b5cf6", "#f59e0b", "#c084fc"],
        green: ["#10b981", "#34d399", "#bef264"],
        lavender: ["#a855f7", "#38bdf8", "#f472b6"],
        heartMorph: ["#38bdf8", "#a855f7", "#f43f5e", "#10b981", "#f59e0b"],
        aurora: ["#38bdf8", "#a855f7", "#ff2a85", "#34d399"],
        fireworks: ["#ff2a85", "#38bdf8", "#34d399", "#fbbf24", "#c084fc"]
      };
      const cols = modePalette[particleMode] || ["#ff2a85", "#38bdf8", "#fbbf24"];
      for (let i = 0; i < 2; i++) {
        pointerSparks.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 2.4,
          vy: (Math.random() - 0.5) * 2.4 - 0.6,
          size: Math.random() * 4 + 2,
          alpha: 0.9,
          color: cols[Math.floor(Math.random() * cols.length)]
        });
      }
    }

    window.addEventListener("mousemove", (e) => spawnPointerSpark(e.clientX, e.clientY));
    window.addEventListener("touchmove", (e) => {
      if (e.touches && e.touches[0]) {
        spawnPointerSpark(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    function drawMiniHeart(ctx, x, y, size, color, alpha, rot = 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, size * 0.35);
      ctx.bezierCurveTo(size * 0.5, -size * 0.35, size * 1.15, size * 0.15, 0, size);
      ctx.bezierCurveTo(-size * 1.15, size * 0.15, -size * 0.5, -size * 0.35, 0, size * 0.35);
      ctx.fill();
      ctx.restore();
    }

    function setParticleMode(mode) {
      particleMode = mode;
      ambientParticles = [];

      const count =
        mode === "intro" ? 70 :
        mode === "aurora" ? 80 :
        mode === "green" ? 65 :
        mode === "blue" ? 55 :
        mode === "royal" ? 50 : 50;

      const palettes = {
        intro: ["#ff2a85", "#38bdf8", "#a855f7", "#ffffff"],
        gold: ["#f59e0b", "#fb923c", "#fb7185", "#fcd34d"],
        blue: ["#0ea5e9", "#3b82f6", "#38bdf8", "#6366f1"],
        royal: ["#7c3aed", "#a855f7", "#f59e0b", "#6366f1"],
        green: ["#10b981", "#34d399", "#84cc16", "#059669", "#fbbf24"],
        lavender: ["#a855f7", "#38bdf8", "#f472b6", "#818cf8"],
        aurora: ["#38bdf8", "#a855f7", "#ff2a85", "#34d399", "#fbbf24"]
      };

      const colors = palettes[mode] || palettes.gold;

      for (let i = 0; i < count; i++) {
        ambientParticles.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          vx: (Math.random() - 0.5) * (mode === "green" ? 0.9 : 0.7),
          vy: mode === "aurora" || mode === "blue"
              ? -(Math.random() * 0.8 + 0.35)
              : mode === "green"
                ? (Math.random() - 0.5) * 0.7
                : (Math.random() * 0.7 + 0.3),
          size: Math.random() * (mode === "blue" ? 9 : 5.5) + 2.5,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.03,
          alpha: Math.random() * 0.55 + 0.25,
          phase: Math.random() * Math.PI * 2,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      if (mode === "heartMorph") {
        buildHeartMorphTargets();
      }
    }

    function buildHeartMorphTargets() {
      const cx = bgCanvas.width / 2;
      const cy = bgCanvas.height * 0.45;
      const scale = Math.min(bgCanvas.width, bgCanvas.height) / 36;
      const total = 270;
      const colors = ["#38bdf8", "#a855f7", "#ff2a85", "#10b981", "#fbbf24", "#f472b6"];

      heartMorphParticles = [];
      for (let i = 0; i < total; i++) {
        const t = (Math.PI * 2 * i) / total;
        const spread = 0.78 + Math.random() * 0.28;
        const hx = 16 * Math.pow(Math.sin(t), 3) * scale * spread;
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale * spread;

        heartMorphParticles.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          baseTx: cx + hx,
          baseTy: cy + hy,
          vx: 0,
          vy: 0,
          size: Math.random() * 3.1 + 1.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: Math.random() * 0.65 + 0.35
        });
      }
    }

    function launchFirework(isHeartShape = false) {
      const colors = ["#ff2a85", "#38bdf8", "#34d399", "#fbbf24", "#c084fc", "#fb7185", "#ffffff"];
      fireworkRockets.push({
        x: bgCanvas.width * (0.15 + Math.random() * 0.7),
        y: bgCanvas.height + 10,
        targetY: bgCanvas.height * (0.15 + Math.random() * 0.38),
        vy: -(Math.random() * 5 + 9),
        color: colors[Math.floor(Math.random() * colors.length)],
        isHeartShape
      });
    }

    function explodeFirework(rocket) {
      if (rocket.isHeartShape) {
        const pts = 46;
        for (let i = 0; i < pts; i++) {
          const t = (Math.PI * 2 * i) / pts;
          const vx = (16 * Math.pow(Math.sin(t), 3)) * 0.28;
          const vy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.28;
          fireworkSparks.push({
            x: rocket.x, y: rocket.y, vx, vy,
            alpha: 1, decay: 0.013, size: 3.2, color: rocket.color, isHeart: true
          });
        }
      } else {
        const colors = ["#ff2a85", "#38bdf8", "#34d399", "#fbbf24", "#c084fc", "#ffffff"];
        const count = 48;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
          const speed = Math.random() * 5.8 + 1.8;
          fireworkSparks.push({
            x: rocket.x, y: rocket.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1, decay: 0.014 + Math.random() * 0.01,
            size: Math.random() * 2.8 + 1.5,
            color: colors[Math.floor(Math.random() * colors.length)],
            isHeart: false
          });
        }
      }
    }

    function animateBgCanvas() {
      if (particleMode === "fireworks") {
        bgCtx.fillStyle = "rgba(4, 3, 8, 0.2)";
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      } else {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      }

      if (particleMode === "heartMorph") {
        heartBeatPhase += 0.045;
        const pulse = 1 + Math.sin(heartBeatPhase) * 0.065;
        const cx = bgCanvas.width / 2;
        const cy = bgCanvas.height * 0.45;

        for (let p of heartMorphParticles) {
          const tx = cx + (p.baseTx - cx) * pulse;
          const ty = cy + (p.baseTy - cy) * pulse;

          const dxm = p.x - mousePos.x;
          const dym = p.y - mousePos.y;
          const distM = Math.sqrt(dxm * dxm + dym * dym);
          if (distM < 90) {
            p.vx += (dxm / (distM || 1)) * 1.4;
            p.vy += (dym / (distM || 1)) * 1.4;
          }

          p.vx += (tx - p.x) * 0.05;
          p.vy += (ty - p.y) * 0.05;
          p.vx *= 0.84;
          p.vy *= 0.84;
          p.x += p.vx;
          p.y += p.vy;

          bgCtx.save();
          bgCtx.globalAlpha = p.alpha;
          bgCtx.shadowBlur = 12;
          bgCtx.shadowColor = p.color;
          bgCtx.fillStyle = p.color;
          bgCtx.beginPath();
          bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          bgCtx.fill();
          bgCtx.restore();
        }
      } else if (particleMode === "fireworks") {
        if (Math.random() < 0.065) {
          launchFirework(Math.random() < 0.45);
        }
        for (let i = fireworkRockets.length - 1; i >= 0; i--) {
          const r = fireworkRockets[i];
          r.y += r.vy;
          r.vy *= 0.985;
          bgCtx.fillStyle = r.color;
          bgCtx.beginPath();
          bgCtx.arc(r.x, r.y, 3, 0, Math.PI * 2);
          bgCtx.fill();
          if (r.y <= r.targetY || r.vy > -1.5) {
            explodeFirework(r);
            fireworkRockets.splice(i, 1);
          }
        }
        for (let i = fireworkSparks.length - 1; i >= 0; i--) {
          const s = fireworkSparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.055;
          s.vx *= 0.985;
          s.alpha -= s.decay;
          if (s.alpha <= 0) {
            fireworkSparks.splice(i, 1);
            continue;
          }
          if (s.isHeart) {
            drawMiniHeart(bgCtx, s.x, s.y, s.size * 1.6, s.color, s.alpha);
          } else {
            bgCtx.save();
            bgCtx.globalAlpha = s.alpha;
            bgCtx.shadowBlur = 10;
            bgCtx.shadowColor = s.color;
            bgCtx.fillStyle = s.color;
            bgCtx.beginPath();
            bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            bgCtx.fill();
            bgCtx.restore();
          }
        }
      } else {
        for (let p of ambientParticles) {
          p.phase += 0.03;
          p.x += p.vx + (particleMode === "green" ? Math.sin(p.phase) * 0.4 : 0);
          p.y += p.vy + (particleMode === "green" ? Math.cos(p.phase) * 0.3 : 0);
          p.rot += p.vRot;

          if (p.y > bgCanvas.height + 20) { p.y = -15; p.x = Math.random() * bgCanvas.width; }
          if (p.y < -20) { p.y = bgCanvas.height + 15; p.x = Math.random() * bgCanvas.width; }
          if (p.x > bgCanvas.width + 20) p.x = -15;
          if (p.x < -20) p.x = bgCanvas.width + 15;

          bgCtx.save();
          if (particleMode === "blue") {
            bgCtx.globalAlpha = p.alpha * 0.45;
            bgCtx.strokeStyle = p.color;
            bgCtx.lineWidth = 1.6;
            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            bgCtx.stroke();
            bgCtx.fillStyle = p.color;
            bgCtx.globalAlpha = p.alpha * 0.16;
            bgCtx.fill();
          } else if (particleMode === "royal") {
            bgCtx.translate(p.x, p.y);
            bgCtx.rotate(p.rot);
            bgCtx.globalAlpha = p.alpha * 0.7;
            bgCtx.fillStyle = p.color;
            bgCtx.beginPath();
            bgCtx.moveTo(0, -p.size);
            bgCtx.lineTo(p.size * 0.7, 0);
            bgCtx.lineTo(0, p.size);
            bgCtx.lineTo(-p.size * 0.7, 0);
            bgCtx.closePath();
            bgCtx.fill();
          } else if (particleMode === "green") {
            const glowAlpha = (Math.sin(p.phase * 1.5) * 0.4 + 0.6) * p.alpha;
            bgCtx.globalAlpha = glowAlpha;
            bgCtx.shadowBlur = 14;
            bgCtx.shadowColor = p.color;
            bgCtx.fillStyle = p.color;
            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2);
            bgCtx.fill();
          } else if (particleMode === "gold" || particleMode === "lavender") {
            drawMiniHeart(bgCtx, p.x, p.y, p.size * 1.1, p.color, p.alpha * 0.55, p.rot);
          } else {
            bgCtx.globalAlpha = p.alpha;
            bgCtx.shadowBlur = 10;
            bgCtx.shadowColor = p.color;
            bgCtx.fillStyle = p.color;
            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.size * 0.55, 0, Math.PI * 2);
            bgCtx.fill();
          }
          bgCtx.restore();
        }
      }

      // Pointer Sparkles
      for (let i = pointerSparks.length - 1; i >= 0; i--) {
        const s = pointerSparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= 0.032;
        if (s.alpha <= 0) {
          pointerSparks.splice(i, 1);
          continue;
        }
        drawMiniHeart(bgCtx, s.x, s.y, s.size * 1.15, s.color, s.alpha);
      }

      requestAnimationFrame(animateBgCanvas);
    }

    setParticleMode("intro");
    animateBgCanvas();

    /* =========================================================================
       PROCEDURAL BLOOMING LOVE TREE ENGINE (MULTI-COLOR BLOSSOMS)
       ========================================================================= */
    let treeAnimId = null;

    function startLoveTreeAnimation() {
      const canvas = document.getElementById("love-tree-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const W = rect.width || 340;
      const H = rect.height || 300;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.scale(dpr, dpr);

      let branches = [];
      let heartLeaves = [];
      let floatingLeaves = [];

      function buildTree(x, y, len, angle, depth, width) {
        const endX = x + Math.cos(angle) * len;
        const endY = y + Math.sin(angle) * len;
        branches.push({
          x1: x, y1: y, x2: endX, y2: endY,
          width, depth, progress: 0
        });

        if (depth <= 2) {
          const leafColors = ["#ff2a85", "#f59e0b", "#10b981", "#38bdf8", "#a855f7", "#fb7185"];
          const leafCount = depth === 0 ? 7 : 4;
          for (let i = 0; i < leafCount; i++) {
            heartLeaves.push({
              x: endX + (Math.random() - 0.5) * 28,
              y: endY + (Math.random() - 0.5) * 24,
              targetSize: Math.random() * 6 + 4.5,
              size: 0,
              color: leafColors[Math.floor(Math.random() * leafColors.length)],
              rot: (Math.random() - 0.5) * 1.1,
              delay: (6 - depth) * 10 + Math.random() * 35
            });
          }
        }

        if (depth > 0) {
          const subLen = len * (0.72 + Math.random() * 0.08);
          buildTree(endX, endY, subLen, angle - (0.32 + Math.random() * 0.16), depth - 1, width * 0.7);
          buildTree(endX, endY, subLen, angle + (0.32 + Math.random() * 0.16), depth - 1, width * 0.7);
        }
      }

      buildTree(W / 2, H - 14, H * 0.26, -Math.PI / 2, 5, 9);

      let frame = 0;
      if (treeAnimId) cancelAnimationFrame(treeAnimId);

      function renderTree() {
        frame++;
        ctx.clearRect(0, 0, W, H);

        // Soft emerald meadow glow under trunk
        const grad = ctx.createRadialGradient(W / 2, H - 12, 4, W / 2, H - 12, 95);
        grad.addColorStop(0, "rgba(16, 185, 129, 0.3)");
        grad.addColorStop(1, "rgba(16, 185, 129, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(W / 2, H - 12, 95, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        // Draw growing branches
        for (let b of branches) {
          const startFrame = (5 - b.depth) * 14;
          if (frame > startFrame) {
            b.progress = Math.min(1, b.progress + 0.075);
            const curX = b.x1 + (b.x2 - b.x1) * b.progress;
            const curY = b.y1 + (b.y2 - b.y1) * b.progress;
            ctx.strokeStyle = "#5c3d2e";
            ctx.lineWidth = b.width;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(b.x1, b.y1);
            ctx.lineTo(curX, curY);
            ctx.stroke();
          }
        }

        // Bloom colorful heart leaves
        for (let l of heartLeaves) {
          if (frame > l.delay) {
            l.size += (l.targetSize - l.size) * 0.12;
            drawMiniHeart(ctx, l.x, l.y, l.size, l.color, 0.92, l.rot);
          }
        }

        // Floating drifting petals
        if (frame > 75 && Math.random() < 0.2) {
          const src = heartLeaves[Math.floor(Math.random() * heartLeaves.length)];
          if (src && src.size > 3) {
            floatingLeaves.push({
              x: src.x, y: src.y,
              vx: (Math.random() - 0.3) * 1.2,
              vy: Math.random() * 0.8 + 0.45,
              size: src.targetSize * 0.85,
              color: src.color,
              rot: src.rot,
              alpha: 0.9
            });
          }
        }

        for (let i = floatingLeaves.length - 1; i >= 0; i--) {
          const fl = floatingLeaves[i];
          fl.x += fl.vx + Math.sin(frame * 0.04 + i) * 0.35;
          fl.y += fl.vy;
          fl.rot += 0.025;
          fl.alpha -= 0.008;
          if (fl.alpha <= 0 || fl.y > H + 10) {
            floatingLeaves.splice(i, 1);
            continue;
          }
          drawMiniHeart(ctx, fl.x, fl.y, fl.size, fl.color, fl.alpha, fl.rot);
        }

        treeAnimId = requestAnimationFrame(renderTree);
      }

      renderTree();
    }

    /* =========================================================================
       SCROLL-TRIGGERED REVEAL & DYNAMIC COLOR SWITCHER
       ========================================================================= */
    let scrollObserver = null;

    function initScrollObservers() {
      if (scrollObserver) scrollObserver.disconnect();
      let treeStarted = false;

      scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");

            const trigger = entry.target.getAttribute("data-trigger");
            const stage = document.getElementById("main-stage");

            if (trigger === "love-tree") {
              setStageTheme("theme-green");
              setParticleMode("green");
              if (!treeStarted) {
                treeStarted = true;
                playChime("magic");
                setTimeout(startLoveTreeAnimation, 150);
              }
            } else if (trigger === "lavender-card") {
              setStageTheme("theme-lavender");
              setParticleMode("lavender");
              playChime("cute");
            } else if (trigger === "heart-morph") {
              setStageTheme("theme-lavender");
              setParticleMode("heartMorph");
              playChime("magic");
            }
          }
        });
      }, { threshold: 0.32 });

      document.querySelectorAll(".scroll-reveal").forEach((el) => scrollObserver.observe(el));
    }

    function setStageTheme(themeClass) {
      const stage = document.getElementById("main-stage");
      stage.classList.remove("theme-peach", "theme-blue", "theme-royal", "theme-green", "theme-lavender", "theme-dark-aurora");
      stage.classList.add(themeClass);
    }

    /* =========================================================================
       DOWNLOADABLE MULTI-COLOR DATE PASS CARD (PNG) & WHATSAPP SHARE
       ========================================================================= */
    function downloadDateCard() {
      playChime("cute");
      try {
        const c = document.createElement("canvas");
        c.width = 1080;
        c.height = 1350;
        const ctx = c.getContext("2d");

        const grad = ctx.createLinearGradient(0, 0, 1080, 1350);
        grad.addColorStop(0, "#050712");
        grad.addColorStop(0.35, "#1a0b2e");
        grad.addColorStop(0.7, "#3b0a2a");
        grad.addColorStop(1, "#061b29");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1350);

        const glow = ctx.createRadialGradient(540, 560, 40, 540, 560, 520);
        glow.addColorStop(0, "rgba(255, 42, 133, 0.34)");
        glow.addColorStop(0.55, "rgba(56, 189, 248, 0.16)");
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 1080, 1350);

        ctx.strokeStyle = "#ff5ca3";
        ctx.lineWidth = 6;
        ctx.strokeRect(55, 55, 970, 1240);
        ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
        ctx.lineWidth = 2;
        ctx.strokeRect(75, 75, 930, 1200);

        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 32px 'Plus Jakarta Sans', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("OFFICIAL VIP DATE PASS • ADMIT TWO", 540, 185);

        ctx.font = "90px serif";
        ctx.fillText("💖", 540, 325);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 92px 'Playfair Display', Georgia, serif";
        ctx.fillText("She Said YES!", 540, 465);

        ctx.fillStyle = "#ff7ab6";
        ctx.font = "italic 76px 'Playfair Display', Georgia, serif";
        ctx.fillText(`${CONFIG.boyName}  &  ${CONFIG.girlName}`, 540, 610);

        ctx.strokeStyle = "rgba(255,255,255,0.28)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(220, 695);
        ctx.lineTo(860, 695);
        ctx.stroke();

        ctx.fillStyle = "#e0f2fe";
        ctx.font = "500 32px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText("“Every single move brought me closer to you.”", 540, 770);
        ctx.font = "bold 26px 'Plus Jakarta Sans', sans-serif";
        ctx.fillStyle = "#38bdf8";
        ctx.fillText("Bangalore 📍 • 6'1 Baller & Medium Pacer • Unedited Memories 🎬", 540, 825);
        ctx.fillStyle = "#fbcfe8";
        ctx.font = "500 26px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText("Sweet laughs, ice cream & good times guaranteed ✨", 540, 880);

        ctx.fillStyle = "rgba(255, 42, 133, 0.25)";
        ctx.fillRect(260, 965, 560, 96);
        ctx.strokeStyle = "#ff5ca3";
        ctx.lineWidth = 3;
        ctx.strokeRect(260, 965, 560, 96);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 34px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText("STATUS: DATE CONFIRMED 🥂", 540, 1026);

        ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
        ctx.font = "500 26px 'Plus Jakarta Sans', sans-serif";
        ctx.fillText("Approved by Wingman • Screenshot & Send to " + CONFIG.boyName, 540, 1185);

        const link = document.createElement("a");
        link.download = `Date-Pass-${CONFIG.boyName}-${CONFIG.girlName}.png`;
        link.href = c.toDataURL("image/png");
        link.click();

        showToast("Date Pass downloaded! Send it to " + CONFIG.boyName + " 💖");
      } catch (e) {
        showToast("Take a screenshot of this Date Pass & send it to " + CONFIG.boyName + "! 💖");
      }
    }
